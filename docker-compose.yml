services:
  phone-contacts-backend-api:
    container_name: phone-contacts-backend-api
    build: ./backend-api
    links:
      - phone-contacts-mysql
    ports:
      - '62221:80'
    volumes:  
      - ./backend-api:/var/www/html

  phone-contacts-phpmyadmin:
    container_name: phone-contacts-phpmyadmin
    image: phpmyadmin/phpmyadmin
    platform: linux/amd64
    links:
      - phone-contacts-mysql
    ports:
      - 62222:80
    environment:
      PMA_ARBITRARY: 1
      PMA_HOST: phone-contacts-mysql
      PMA_USER: root
      PMA_PASSWORD: password

  phone-contacts-mysql:
    container_name: phone-contacts-mysql
    image: mysql:8.0.31
    command: --default-authentication-plugin=mysql_native_password
    platform: linux/amd64
    ports:
      - '61223:3306'
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: phone-contacts
    volumes:
      - ./initdb.d:/docker-entrypoint-initdb.d
